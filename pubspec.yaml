name: stowa
description: "Черновик, который разбирает себя сам."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  just_audio: ^0.10.6
  mime: ^2.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  record: ^7.1.2
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  material_symbols_icons: ^4.2960.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
    - family: StowaSymbols
      fonts:
        - asset: assets/fonts/StowaSymbols.ttf
    - family: StowaSymbolsFilled
      fonts:
        - asset: assets/fonts/StowaSymbolsFilled.ttf

name: stowa
description: "Черновик, который разбирает себя сам."
publish_to: 'none'
version: 0.1.3+7

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.6.0
  connectivity_plus: ^7.3.2
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  dynamic_color: ^1.7.0
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  geocoding: ^5.0.1
  geolocator: ^14.0.1
  html: ^0.15.7
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  just_audio: ^0.10.6
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  mime: ^2.1.0
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  receive_sharing_intent: ^1.9.0
  record: ^7.1.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  snowball_stemmer: ^0.1.0
  stack_trace: ^1.12.1
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  workmanager: ^0.10.10
  yaml: ^3.1.3
  zxing2: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  material_symbols_icons: ^4.2960.0
  sqlite3: ^3.8.0
  pdf: ^3.11.3

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
    - family: StowaSymbols
      fonts:
        - asset: assets/fonts/StowaSymbols.ttf
    - family: StowaSymbolsFilled
      fonts:
        - asset: assets/fonts/StowaSymbolsFilled.ttf

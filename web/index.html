<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Stowa: заметки, ссылки и файлы в одной папке, как в Obsidian.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0C0D0E">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stowa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Stowa</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* пока грузится движок: фон приложения, а не белая вспышка */
    html, body { margin: 0; height: 100%; background: #0C0D0E; }
    @media (prefers-color-scheme: light) { html, body { background: #ECECE9; } }

    /* заставка до первого кадра: три точки дышат, без слов — язык человека ещё не известен */
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: opacity .4s ease; pointer-events: none;
    }
    #loading span {
      width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, .6);
      animation: breathe 1.8s ease-in-out infinite;
    }
    #loading span:nth-child(2) { animation-delay: .25s; }
    #loading span:nth-child(3) { animation-delay: .5s; }
    @keyframes breathe { 0%, 100% { opacity: .25; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
    @media (prefers-color-scheme: light) { #loading span { background: rgba(0, 0, 0, .5); } }
    @media (prefers-reduced-motion: reduce) { #loading span { animation: none; opacity: .6; } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-label="Stowa"><span></span><span></span><span></span></div>
  <script>
    // заставка уходит с первым кадром приложения: большое хранилище открывается секундами,
    // и всё это время на экране была пустота
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (!loading) return;
      loading.style.opacity = '0';
      setTimeout(function () { loading.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

name: Сборка APK

# вручную — APK для проверки на телефоне; тег v* — ещё и релиз на GitHub
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - name: Ключ подписи из секретов
        env:
          KEYSTORE: ${{ secrets.STOWA_KEYSTORE_BASE64 }}
          PROPERTIES: ${{ secrets.STOWA_KEY_PROPERTIES }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/stowa-release.jks
          printf '%s\n' "$PROPERTIES" > android/key.properties
      # иконки выбираются по имени из базы, поэтому шрифт иконок не урезается
      - run: flutter build apk --release --split-per-abi --no-tree-shake-icons
      - name: Имена Stowa-версия-abi.apk
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/Stowa-$version-$abi.apk"
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Stowa-${{ env.VERSION }}
          path: dist/*.apk
      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "Stowa $VERSION" --generate-notes

name: Проверка

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter analyze
      # тяжёлые тесты (симуляции синхронизации, длинные тексты) — отдельным шагом:
      # рядом с ними тесты на время сохранения не укладывались в свои 100 мс
      - run: flutter test --exclude-tags heavy
      - run: flutter test --tags heavy

  # веб-версия собирается из того же кода: правка для телефона не должна её ломать
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter build web --release --no-web-resources-cdn --no-tree-shake-icons

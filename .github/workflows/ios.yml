name: iPhone → собирается и запускается ли

# Зачем: на ноутбуке без macOS приложение для iPhone не собрать и не запустить.
# Здесь оно собирается под симулятор, открывается, читает заметку,
# положенную в его папку «Документы», и отдаёт снимки экрана.
# Следом принимает текст и картинку так, как их отдаёт расширение «Поделиться»: кадры в out/shared/.
# Потом вторая сборка сама проходит главные экраны (integration_test/walk_test.dart),
# а прогон снимает каждый: снимки и итог по шагам лежат в out/walk/.
# Только вручную: прогон идёт около получаса, на каждый пуш он не нужен.
on:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Самый свежий Xcode
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -z "$NEWEST" ] && NEWEST=/Applications/Xcode.app
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      # плагины приходят пакетами Swift: CocoaPods и Podfile не нужны
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n

      # --no-tree-shake-icons: значок выбирается по имени из базы
      - name: Сборка под симулятор
        run: flutter build ios --simulator --debug --no-tree-shake-icons

      # без расширения Stowa нет в системном листе «Поделиться»
      - name: Расширение «Поделиться» в сборке
        run: |
          set -euo pipefail
          APP=build/ios/iphonesimulator/Runner.app
          SHARE="$APP/PlugIns/ShareExtension.appex"
          [ -d "$SHARE" ] || { echo "Расширения в сборке нет"; ls -R "$APP/PlugIns" || true; exit 1; }
          value() { /usr/libexec/PlistBuddy -c "Print :$2" "$1/Info.plist"; }
          same() { [ "$1" = "$2" ] || { echo "$3: «$1», а нужно «$2»"; exit 1; }; }
          same "$(value "$SHARE" CFBundleIdentifier)" app.stowa.Share "Идентификатор расширения"
          same "$(value "$SHARE" AppGroupId)" group.app.stowa "Группа расширения"
          same "$(value "$APP" AppGroupId)" group.app.stowa "Группа приложения"
          same "$(value "$APP" CFBundleURLTypes:0:CFBundleURLSchemes:0)" ShareMedia-app.stowa "Ссылка приложения"
          # разные версии у приложения и расширения магазин не принимает
          for key in CFBundleVersion CFBundleShortVersionString; do
            same "$(value "$SHARE" "$key")" "$(value "$APP" "$key")" "$key расширения"
          done

      - name: Запуск в симуляторе
        run: |
          set -euo pipefail
          mkdir -p out
          # самый новый iPhone из установленных
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          version = lambda name: [int(part) for part in name.split('iOS-')[1].split('-')]
          newest = sorted((name for name in runtimes if 'iOS-' in name and runtimes[name]), key=version)
          print(next(device['udid'] for name in reversed(newest) for device in runtimes[name] if device['name'].startswith('iPhone')))
          ")
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          # без клавиатуры компьютера: на снимках встаёт экранная
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          # система по-русски: приложение, открытое ссылкой, языка в параметрах не получает
          python3 - "$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE/data/Library/Preferences" <<'PY' || true
          import os, plistlib, sys
          folder = sys.argv[1]
          os.makedirs(folder, exist_ok=True)
          path = os.path.join(folder, ".GlobalPreferences.plist")
          settings = {}
          if os.path.exists(path):
              with open(path, "rb") as file:
                  settings = plistlib.load(file)
          settings["AppleLanguages"] = ["ru-RU"]
          settings["AppleLocale"] = "ru_RU"
          with open(path, "wb") as file:
              plistlib.dump(settings, file, fmt=plistlib.FMT_BINARY)
          PY
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app

          open_app() {
            xcrun simctl launch --console-pty "$DEVICE" app.stowa -AppleLanguages "(ru)" -AppleLocale ru_RU >> out/app.log 2>&1 &
            sleep 60
          }

          # первый запуск: пустое приложение
          open_app
          xcrun simctl io "$DEVICE" screenshot out/1-first-launch.png

          # заметки кладутся в «Документы» мимо приложения, как это сделал бы человек через «Файлы»
          xcrun simctl terminate "$DEVICE" app.stowa
          DATA=$(xcrun simctl get_app_container "$DEVICE" app.stowa data)
          mkdir -p "$DATA/Documents/Идеи"
          printf 'Заметка из «Файлов»\n\nЛежала в папке до запуска.\n' > "$DATA/Documents/Из Файлов.md"
          printf 'Заметка в папке\n\nПапка «Идеи» создана вручную.\n' > "$DATA/Documents/Идеи/В папке.md"

          # второй запуск: обе заметки должны появиться на главной
          open_app
          xcrun simctl io "$DEVICE" screenshot out/2-notes-from-files.png

          {
            echo "== Документы"
            (cd "$DATA/Documents" && find . | sort)
            echo "== Application Support"
            (cd "$DATA/Library/Application Support" && find . -maxdepth 2 | sort)
            echo "== Из Файлов.md после запуска"
            cat "$DATA/Documents/Из Файлов.md"
          } > out/container.txt 2>&1 || true
          cat out/container.txt

          xcrun simctl spawn "$DEVICE" log show --last 5m --style compact --predicate 'process == "Runner"' > out/system.log 2>&1 || true
          tail -n 60 out/app.log || true

          # закрылось само — значит упало: прогон красный, причина в журналах
          xcrun simctl spawn "$DEVICE" launchctl list | grep app.stowa || { echo "Приложение не работает после запуска"; exit 1; }
          # база не должна лежать среди заметок
          [ -z "$(find "$DATA/Documents" -name 'stowa.sqlite*')" ] || { echo "База лежит в «Документах»"; exit 1; }
          [ -n "$(find "$DATA/Library" -name 'stowa.sqlite')" ] || { echo "База не создана"; exit 1; }

      # присланное лежит в папке группы так, как его кладёт расширение, приложение открывается ссылкой расширения
      - name: Присланное через «Поделиться»
        run: |
          set -euo pipefail
          mkdir -p out/shared
          # нажимает кнопки системных окон симулятора по подписи
          brew install cameroncooke/axe/axe > out/shared/axe-install.log 2>&1 || { tail -n 30 out/shared/axe-install.log; echo "AXe не поставился"; exit 1; }
          xcrun simctl terminate "$DEVICE" app.stowa || true
          DATA=$(xcrun simctl get_app_container "$DEVICE" app.stowa data)
          GROUP=$(xcrun simctl get_app_container "$DEVICE" app.stowa group.app.stowa 2>/dev/null || true)
          if [ -z "$GROUP" ]; then
            echo "Папки группы нет: приложение не получило group.app.stowa"
            xcrun simctl get_app_container "$DEVICE" app.stowa groups || true
            codesign -d --entitlements - build/ios/iphonesimulator/Runner.app || true
            exit 1
          fi

          TEXT="Заметка из расширения Поделиться"
          PICTURE="$GROUP/shared/11111111-2222-3333-4444-555555555555/Значок.png"
          mkdir -p "$(dirname "$PICTURE")" "$GROUP/Library/Preferences"
          cp ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png "$PICTURE"
          python3 - "$GROUP/Library/Preferences/group.app.stowa.plist" "$TEXT" "$PICTURE" <<'PY'
          import json, plistlib, sys
          target, text, picture = sys.argv[1:]
          pieces = [
              {"path": text, "type": "text"},
              {"path": "file://" + picture, "type": "image", "mimeType": "image/png"},
          ]
          with open(target, "wb") as file:
              plistlib.dump({"ShareKey": json.dumps(pieces, ensure_ascii=False).encode()}, file, fmt=plistlib.FMT_BINARY)
          PY

          xcrun simctl io "$DEVICE" recordVideo --codec h264 --force out/shared/screen.mp4 > out/shared/record.log 2>&1 &
          RECORD=$!
          sleep 2
          xcrun simctl openurl "$DEVICE" "ShareMedia-app.stowa:share"
          # ссылку из simctl система переспрашивает «Открыть в приложении „Stowa“?»: кнопку жмёт AXe
          # на телефоне вопроса нет, приложение открывает само расширение
          OPENED=""
          for attempt in $(seq 1 20); do
            sleep 1
            for label in "Открыть" "Open"; do
              if axe tap --label "$label" --udid "$DEVICE" >> out/shared/tap.log 2>&1; then OPENED=$label; break 2; fi
            done
          done
          axe describe-ui --udid "$DEVICE" > out/shared/ui.json 2>&1 || true
          echo "Кнопка вопроса: ${OPENED:-не нажата}"
          # лист «Положил в …» живёт три секунды: кадры идут подряд целую минуту
          started=$(date +%s)
          frame=0
          while [ $(( $(date +%s) - started )) -lt 60 ]; do
            frame=$((frame + 1))
            xcrun simctl io "$DEVICE" screenshot "out/shared/$(printf '%02d' "$frame").png" > /dev/null 2>&1 || true
            sleep 1
          done
          # запись закрывает файл только по Ctrl+C; зависла — снимаем силой
          kill -INT "$RECORD" 2>/dev/null || true
          for attempt in $(seq 1 20); do
            kill -0 "$RECORD" 2>/dev/null || break
            sleep 1
          done
          kill -9 "$RECORD" 2>/dev/null || true

          {
            echo "== Папка группы"
            (cd "$GROUP" && find . | sort)
            echo "== Документы"
            (cd "$DATA/Documents" && find . | sort)
          } > out/shared/files.txt 2>&1 || true
          cat out/shared/files.txt
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "Runner"' > out/shared/system.log 2>&1 || true
          # видит ли система расширение: на итог не влияет
          xcrun simctl spawn "$DEVICE" pluginkit -m -p com.apple.share-services > out/extensions.txt 2>&1 || true
          cat out/extensions.txt || true

          xcrun simctl spawn "$DEVICE" launchctl list | grep app.stowa || { echo "Приложение не работает после ссылки"; exit 1; }
          grep -rlF "$TEXT" "$DATA/Documents" || { echo "Заметки с присланным текстом нет"; exit 1; }
          [ -z "$(find "$GROUP/shared" -type f 2>/dev/null)" ] || { echo "Картинка осталась в папке группы"; exit 1; }
          [ -n "$(find "$DATA/Documents" -name '*.png')" ] || { echo "Картинки нет среди заметок"; exit 1; }

      # та же программа, но вместо человека по ней идёт маршрут
      - name: Сборка прохода
        run: flutter build ios --simulator --debug --no-tree-shake-icons --target=integration_test/walk_test.dart

      - name: Проход по экранам
        run: |
          set -euo pipefail
          mkdir -p out/walk
          # с чистого листа: заметки первого запуска маршруту мешают
          xcrun simctl terminate "$DEVICE" app.stowa || true
          xcrun simctl uninstall "$DEVICE" app.stowa
          # на случай, если система дочищает разрешения удалённого приложения с задержкой
          sleep 5
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app
          # системные окна тест закрыть не может: что можно, разрешено заранее
          for access in photos photos-add microphone location; do
            xcrun simctl privacy "$DEVICE" grant "$access" app.stowa
          done
          TCC="$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE/data/Library/TCC/TCC.db"
          # что система записала про разрешения: по этим файлам видно, куда делось выданное
          permissions() {
            sqlite3 "$TCC" "select service, auth_value, auth_version from access where client = 'app.stowa'" > "out/walk/permissions-$1.txt" 2>&1 || true
          }
          permissions 1-granted
          # simctl пишет доступ к фото первой версией записи, и система всё равно спрашивает: нужна вторая
          sqlite3 "$TCC" "update access set auth_version = 2 where client = 'app.stowa' and service = 'kTCCServicePhotos'" || true
          permissions 1-photos-fixed
          xcrun simctl location "$DEVICE" set 47.0245,28.8322
          xcrun simctl launch --console-pty "$DEVICE" app.stowa -AppleLanguages "(ru)" -AppleLocale ru_RU >> out/walk/app.log 2>&1 &

          DATA=""
          for attempt in $(seq 1 30); do
            DATA=$(xcrun simctl get_app_container "$DEVICE" app.stowa data 2>/dev/null || true)
            [ -n "$DATA" ] && break
            sleep 1
          done
          [ -n "$DATA" ] || { echo "Папка приложения не найдена"; exit 1; }
          permissions 2-launched

          # приложение кладёт «<имя>.request» и ждёт: снимок сделан — запрос убран
          # в shots.log время каждого снимка: симулятор иногда думает над ним десятки секунд
          take_shots() {
            set +e
            while true; do
              find "$DATA/tmp" -name '*.request' 2>/dev/null | while read -r request; do
                name=$(basename "$request" .request)
                started=$(date +%s)
                said=$(xcrun simctl io "$DEVICE" screenshot "out/walk/$name.png" 2>&1)
                echo "$(date +%H:%M:%S) $name: $(( $(date +%s) - started )) с. $said" >> out/walk/shots.log
                rm -f "$request"
              done
              sleep 0.2
            done
          }
          take_shots &
          SHOTS=$!

          # маршрут идёт около четырёх минут, ждём до пятнадцати
          RESULT=""
          for second in $(seq 1 900); do
            RESULT=$(find "$DATA/tmp" -name result.txt -path '*walk*' 2>/dev/null | head -1 || true)
            if [ -n "$RESULT" ] && grep -q '^done$' "$RESULT"; then break; fi
            sleep 1
          done
          kill "$SHOTS" 2>/dev/null || true

          xcrun simctl io "$DEVICE" screenshot out/walk/99-конец.png > /dev/null 2>&1 || true
          permissions 3-finished
          cat out/walk/permissions-*.txt out/walk/shots.log || true
          xcrun simctl spawn "$DEVICE" log show --last 12m --style compact --predicate 'process == "Runner"' > out/walk/system.log 2>&1 || true
          # что служба разрешений ответила на каждый запрос приложения
          xcrun simctl spawn "$DEVICE" log show --last 12m --style compact --predicate 'process == "tccd"' > out/walk/tcc.log 2>&1 || true

          if [ -z "$RESULT" ] || ! grep -q '^done$' "$RESULT"; then
            echo "Маршрут не дошёл до конца"
            tail -n 80 out/walk/app.log || true
            exit 1
          fi
          cp "$RESULT" out/walk/result.txt
          cat out/walk/result.txt
          ! grep -q '^FAIL' out/walk/result.txt || { echo "В маршруте есть упавшие шаги"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-simulator
          path: out/

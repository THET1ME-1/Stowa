<title>Stowa Web</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..40,400..600,0..1,0&display=block">
<style>
/* Рабочее пространство, как в Obsidian и Blender: три части — левый док, центр, правый док.
   Доки собраны из панелей: добавить, убрать, свернуть, перетащить в другой док, потянуть ширину.
   Центр делится на окна вправо и вниз, у каждого окна свои вкладки. Раскладка запоминается.
   Цвета — графит Stowa (palette.dart), цвета папок — FolderPalette, подложка карточки — 16% цвета папки. */
:root {
  --page: #0C0D0E;
  --bg: #141517;
  --c-lowest: #101113;
  --c-low: #1A1B1E;
  --c: #1F2023;
  --c-high: #26272B;
  --c-highest: #2E2F33;
  --line: #3A3B40;
  --on: #F2F2F0;
  --on-var: #B0B1B6;
  --muted: #96979D;
  --accent: #F4F4F2;
  --on-accent: #141517;
  --error: #FFB4AB;
  --tint: 16%;
  --ink: 100%;
  --scrim: rgba(12, 13, 14, .72);
  --display: "Unbounded", "Onest", system-ui, sans-serif;
  --body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-card: 28px; --r-tile: 20px; --r-photo: 16px; --r-ctl: 14px;
  --sb: 272px; --rp: 320px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --page: #ECECE9; --bg: #F6F6F4; --c-lowest: #FFFFFF; --c-low: #F0F0EE; --c: #EAEAE7; --c-high: #E4E4E1; --c-highest: #DCDCD9;
    --line: #C6C6C2; --on: #1B1C1E; --on-var: #46474C; --muted: #5F6066; --accent: #1B1C1E; --on-accent: #F6F6F4; --error: #BA1A1A;
    --tint: 26%; --ink: 58%; --scrim: rgba(27, 28, 30, .42); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --page: #ECECE9; --bg: #F6F6F4; --c-lowest: #FFFFFF; --c-low: #F0F0EE; --c: #EAEAE7; --c-high: #E4E4E1; --c-highest: #DCDCD9;
  --line: #C6C6C2; --on: #1B1C1E; --on-var: #46474C; --muted: #5F6066; --accent: #1B1C1E; --on-accent: #F6F6F4; --error: #BA1A1A;
  --tint: 26%; --ink: 58%; --scrim: rgba(27, 28, 30, .42); color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--on); font: 400 15px/1.5 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.sym { font-family: "Material Symbols Rounded"; font-weight: 450; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; font-variation-settings: "FILL" 0, "opsz" 24; -webkit-font-smoothing: antialiased; user-select: none; }
.sym.f { font-variation-settings: "FILL" 1, "opsz" 24; }
.num { font-variant-numeric: tabular-nums; }

/* цвет папки: точка — --f «чернилами», подложка — смесь с поверхностью */
[data-f] { --f: #96979D; }
[data-f="dom"] { --f: #FEC766; } [data-f="remont"] { --f: #F7A974; } [data-f="work"] { --f: #5FCDF5; }
[data-f="buy"] { --f: #76D5A4; } [data-f="recipes"] { --f: #FFA098; } [data-f="books"] { --f: #BCB1FF; }
[data-f="ideas"] { --f: #B5E285; } [data-f="personal"] { --f: #F89EC1; } [data-f="none"] { --f: #96979D; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: color-mix(in oklab, var(--f) var(--ink), #000); flex: none; }

/* ── каркас: левый док · центр · правый док ─────────── */
/* Как в Obsidian хозяина: каждая часть — отдельный скруглённый блок на фоне окна, между
   блоками зазор. Линий-разделителей нет (в Material 3 их заменяют тон и отступ).
   Вкладки окна лежат на фоне над его блоком, открытая вкладка сливается с блоком. */
:root { --gap: 8px; --r-block: 20px; --block: var(--c-low); }
:root[data-theme="light"] { --block: var(--c-lowest); --page: #DEDEDA; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --block: var(--c-lowest); --page: #DEDEDA; } }
.ws { height: 100%; display: flex; flex-direction: column; background: var(--page); }
.bar { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 var(--gap); padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box; background: var(--page); flex: none; }
.bar .presets { display: flex; gap: 4px; padding: 3px; border-radius: 100px; background: var(--c); margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
.bar .presets button { height: 30px; padding: 0 12px; border-radius: 100px; font-size: 13px; color: var(--on-var); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.bar .presets button .sym { font-size: 17px; }
.bar .presets button:hover { color: var(--on); background: var(--c-high); }
.bar .presets button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.bar .icon-btn.on { background: var(--c-high); color: var(--on); }
#tog-keys { margin-left: auto; }
.bar .presets + #tog-keys { margin-left: 0; }
.body { flex: 1; display: flex; min-height: 0; padding: 0 max(var(--gap), env(safe-area-inset-right, 0px)) calc(var(--gap) + env(safe-area-inset-bottom, 0px)) max(var(--gap), env(safe-area-inset-left, 0px)); }
.dockcol { flex: none; width: var(--w); display: flex; flex-direction: column; min-height: 0; background: var(--block); border-radius: var(--r-block); overflow: hidden; }
.dockcol[hidden] { display: none; }
.dock-scroll { flex: 1; overflow: auto; min-height: 0; padding: 6px 8px 10px; }
.dock-empty { margin: 8px; padding: 18px 14px; border-radius: 18px; background: var(--c-low); color: var(--muted); font-size: 13px; text-align: center; }
.dock-foot { display: flex; align-items: center; gap: 4px; padding: 6px 10px 8px; position: relative; }
.add-panel { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 10px; font-size: 13px; color: var(--muted); }
.add-panel:hover { background: var(--c); color: var(--on); }
.add-menu { position: absolute; bottom: calc(100% + 6px); left: 8px; right: 8px; z-index: 20; padding: 6px; border-radius: 18px; background: var(--c-high); display: grid; gap: 2px; max-height: 50vh; overflow: auto; }
.add-menu[hidden] { display: none; }
.add-menu button { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 12px; font-size: 14px; text-align: left; }
.add-menu button:hover { background: var(--c-highest); }
.add-menu button .sym { font-size: 18px; color: var(--on-var); }
.add-menu small { padding: 6px 10px 2px; color: var(--muted); font-size: 12px; }

/* панель дока: заголовок — ручка для перетаскивания, кнопки появляются при наведении */
.pnl { margin-bottom: 2px; border-radius: 16px; }
.pnl-head { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 4px 0 6px; border-radius: 12px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; cursor: grab; user-select: none; }
.pnl-head:hover { background: var(--c); color: var(--on-var); }
.pnl-head > .sym { font-size: 17px; }
.pnl-head .chev2 { font-size: 18px; transition: transform .16s; }
.pnl.collapsed .chev2 { transform: rotate(-90deg); }
.pnl.collapsed .pnl-body { display: none; }
.pnl-head .acts { margin-left: auto; display: flex; gap: 1px; opacity: 0; transition: opacity .12s; }
.pnl-head:hover .acts, .pnl-head:focus-within .acts { opacity: 1; }
.mini { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.mini:hover { background: var(--c-high); color: var(--on); }
.mini .sym { font-size: 17px; }
.pnl-body { padding: 2px 2px 10px; }
.pnl.dragging { opacity: .35; }
.drop-mark { height: 3px; border-radius: 2px; background: var(--accent); margin: 1px 8px; }
.pnl-note { color: var(--muted); font-size: 13px; padding: 4px 8px 6px; }

/* ручки — это сами зазоры между блоками; при наведении в середине проступает пилюля */
.gutter { flex: none; width: var(--gap); cursor: col-resize; position: relative; z-index: 6; touch-action: none; display: grid; place-items: center; }
.gutter::after { content: ""; width: 4px; height: 40px; border-radius: 4px; background: transparent; transition: background .12s, height .12s; }
.gutter:hover::after, .gutter.drag::after { background: color-mix(in oklab, var(--on) 40%, transparent); height: 56px; }
.gutter.row { width: auto; height: var(--gap); cursor: row-resize; }
.gutter.row::after { width: 40px; height: 4px; }
.gutter.row:hover::after, .gutter.row.drag::after { width: 56px; height: 4px; }
body.resizing { user-select: none; cursor: col-resize; }
body.resizing.rows { cursor: row-resize; }

/* центр: дерево окон */
.center { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.panes { flex: 1; display: flex; min-height: 0; min-width: 0; }
.split { display: flex; flex: 1; min-width: 0; min-height: 0; }
.split.col { flex-direction: column; }
.slot { display: flex; min-width: 0; min-height: 0; flex-basis: 0; }
.pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
/* вкладки на фоне окна; открытая — того же тона, что блок под ней, и прирастает к нему */
.pane-top { display: flex; align-items: flex-end; gap: 4px; height: 42px; padding: 0 2px 0 0; flex: none; }
.pane-top .tabs { align-self: stretch; align-items: flex-end; }
.pane-top .tab { height: 36px; border-radius: 14px 14px 0 0; padding: 0 8px 2px 14px; }
.pane-top .tab.on { background: var(--block); font-weight: 600; }
.pane:not(.active) .pane-top .tab.on { color: var(--on-var); font-weight: 500; background: color-mix(in oklab, var(--block) 55%, var(--page)); }
.pane-acts { display: flex; gap: 1px; margin-left: auto; flex: none; align-self: center; }
.pane-scroll { flex: 1; overflow: auto; min-height: 0; scroll-behavior: smooth; background: var(--block); border-radius: var(--r-block); }
/* у первой вкладки блок не скруглён сверху слева: вкладка и блок — одно целое */
.pane-top:has(.tab.on:first-child) + .pane-scroll { border-top-left-radius: 0; }
.pane:not(.active) .pane-scroll { background: color-mix(in oklab, var(--block) 55%, var(--page)); }

/* ── боковая панель ── */
.vault { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px 16px; }
.vault-mark { width: 34px; height: 34px; border-radius: 11px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 700 15px var(--display); flex: none; }
.vault-name { font: 600 15px/1.2 var(--body); }
.vault-sync { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); margin-top: 2px; }
.vault-sync i { width: 7px; height: 7px; border-radius: 50%; background: #76D5A4; }
.vault .icon-btn { margin-left: auto; }
.icon-btn { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: var(--on-var); flex: none; }
.icon-btn:hover { background: var(--c-high); color: var(--on); }
.finder { margin: 4px 12px 10px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: var(--r-ctl); background: var(--c); color: var(--muted); font-size: 14px; text-align: left; }
.finder:hover { background: var(--c-high); }
.finder kbd { margin-left: auto; font: 500 11px var(--body); padding: 2px 6px; border-radius: 6px; background: var(--c-highest); color: var(--on-var); }
.side-scroll { flex: 1; overflow: auto; padding: 0 8px 12px; min-height: 0; }
.nav-item { display: flex; align-items: center; gap: 11px; width: 100%; height: 36px; padding: 0 10px; border-radius: 12px; color: var(--on-var); font-size: 14px; text-align: left; }
.nav-item:hover { background: var(--c); color: var(--on); }
.nav-item[aria-current="page"] { background: var(--c-high); color: var(--on); font-weight: 600; }
.nav-item .count { margin-left: auto; font-size: 12px; color: var(--muted); }
.nav-item .sym { color: var(--muted); }
.nav-item[aria-current="page"] .sym { color: var(--on); }
.group { margin-top: 18px; }
.group-head { display: flex; align-items: center; justify-content: space-between; padding: 0 10px 6px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.group-head button { color: var(--muted); }
.tree-row { display: flex; align-items: center; gap: 9px; width: 100%; height: 34px; padding: 0 10px 0 calc(10px + var(--lvl, 0) * 18px); border-radius: 12px; font-size: 14px; color: var(--on); text-align: left; }
.tree-row:hover { background: var(--c); }
.tree-row[aria-current="page"] { background: color-mix(in oklab, var(--f) var(--tint), var(--c)); font-weight: 600; }
.tree-row .chev { width: 16px; color: var(--muted); font-size: 18px; transition: transform .18s; }
.tree-row .chev.open { transform: rotate(90deg); }
.tree-row .count { margin-left: auto; font-size: 12px; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px; }
.tag { height: 28px; padding: 0 10px; border-radius: 100px; background: var(--c); color: var(--on-var); font-size: 13px; display: inline-flex; align-items: center; }
.tag:hover { background: var(--c-high); color: var(--on); }
.side-foot { display: flex; align-items: center; gap: 4px; padding: 8px 12px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid color-mix(in oklab, var(--line) 50%, transparent); }
.me { display: flex; align-items: center; gap: 8px; margin-right: auto; font-size: 13px; color: var(--on-var); }
.me b { width: 28px; height: 28px; border-radius: 50%; background: color-mix(in oklab, #F89EC1 70%, var(--c)); color: #1B1C1E; display: grid; place-items: center; font: 600 12px var(--body); }

/* ── верхняя полоса ── */
.top { display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 12px; padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box; border-bottom: 1px solid color-mix(in oklab, var(--line) 50%, transparent); background: var(--bg); }
.menu-btn { display: none; }
.tabs { display: flex; gap: 4px; min-width: 0; overflow: hidden; flex: 1; }
.tab { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 12px; border-radius: 12px; background: transparent; color: var(--on-var); font-size: 13px; max-width: 220px; min-width: 0; }
.tab span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab:hover { background: var(--c); color: var(--on); }
.tab.on { background: var(--c-high); color: var(--on); font-weight: 600; }
.tab .x { font-size: 16px; color: var(--muted); border-radius: 6px; padding: 2px; }
.tab .x:hover { background: var(--c-highest); }
.top-actions { display: flex; gap: 2px; margin-left: auto; }

/* ── прокручиваемая область ── */
.scroll { flex: 1; overflow: auto; min-height: 0; scroll-behavior: smooth; }
.view { padding: 28px max(24px, env(safe-area-inset-right, 0px)) 140px max(24px, env(safe-area-inset-left, 0px)); }
.view-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.h1 { font: 700 30px/1.15 var(--display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14px; margin-top: 6px; }

/* полка папок одной строкой, как на главной приложения */
.shelf { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 26px; scrollbar-width: none; }
.shelf::-webkit-scrollbar { display: none; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 12px; border-radius: 100px; background: color-mix(in oklab, var(--f) var(--tint), var(--c)); font-size: 14px; font-weight: 500; white-space: nowrap; flex: none; }
.pill:hover { background: color-mix(in oklab, var(--f) calc(var(--tint) + 10%), var(--c)); }
.pill .n { color: var(--on-var); font-size: 13px; }

/* значок папки её цветом: тот же оттенок, что у точки раньше */
.fic { color: color-mix(in oklab, var(--f) var(--ink), #000); font-size: 18px; flex: none; }

/* главная: лента по дням плиткой и колонка «вернуть» */
.home { max-width: 1560px; margin: 0 auto; }
.day { margin-bottom: 28px; }
.day-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px 2px; }
.day-head h2 { font: 600 17px var(--display); letter-spacing: -.01em; margin: 0; }
.day-head span { color: var(--muted); font-size: 13px; }
/* плитка как в Pinterest: столько колонок, сколько влезает по 200 точек, порядок слева
   направо — свежее в первом ряду, — высота карточки по содержимому. Сетка из рядов по 2 точки,
   сколько рядов занять, считает layoutPins() по настоящей высоте карточки */
.pins { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); grid-auto-rows: 2px; column-gap: 14px; }
.pins .card { align-self: start; margin: 0; }
.pins .card h3 { -webkit-line-clamp: 3; }
.pins .card p { -webkit-line-clamp: 6; }
.pins .photo { margin: -16px -18px 12px; width: calc(100% + 36px); border-radius: var(--r-tile) var(--r-tile) var(--r-photo) var(--r-photo); max-height: none; aspect-ratio: var(--ratio, 4 / 5); }
.pins .link-prev { grid-template-columns: 1fr; }
.pins .link-prev .thumb { aspect-ratio: 16 / 9; }
.card .meta .when { margin-left: auto; color: var(--muted); }
.card .meta .rem, .card .meta .folder { white-space: nowrap; }
.card .meta { flex-wrap: wrap; row-gap: 6px; }
.finder { white-space: nowrap; overflow: hidden; }
.card { display: block; width: 100%; text-align: left; margin: 0 0 10px 10px; padding: 16px 18px; border-radius: var(--r-tile); background: color-mix(in oklab, var(--f) var(--tint), var(--c)); transition: transform .16s cubic-bezier(.2, 0, 0, 1), background .16s; }
.card:hover { background: color-mix(in oklab, var(--f) calc(var(--tint) + 7%), var(--c)); }
.card:active { transform: scale(.99); }
.card h3 { font: 600 16px/1.3 var(--body); margin: 0 0 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card p { margin: 0; color: var(--on-var); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: var(--on-var); }
.card .meta .folder { display: inline-flex; align-items: center; gap: 6px; }
.card .meta .rem { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 6px; border-radius: 100px; background: color-mix(in oklab, var(--on) 9%, transparent); }
.card .meta .rem .sym { font-size: 14px; }
.checks { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 5px; font-size: 14px; }
.checks li { display: flex; gap: 8px; align-items: center; color: var(--on); }
.checks li.done { color: var(--muted); text-decoration: line-through; }
.checks .sym { font-size: 18px; color: var(--on-var); }
.checks .more { color: var(--muted); padding-left: 26px; }
.photo { position: relative; border-radius: var(--r-photo); margin: -4px -6px 10px; overflow: hidden; aspect-ratio: 16 / 9; max-height: 220px; width: calc(100% + 12px); background:
  radial-gradient(120% 90% at 20% 15%, color-mix(in oklab, var(--f) 55%, var(--c-high)), transparent 60%),
  radial-gradient(90% 80% at 85% 90%, color-mix(in oklab, var(--f) 30%, var(--c-lowest)), transparent 70%),
  var(--c-high); }
.photo figcaption { position: absolute; left: 10px; bottom: 10px; display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px 4px 8px; border-radius: 100px; background: var(--scrim); color: #F2F2F0; font-size: 12px; }
.photo figcaption .sym { font-size: 16px; }
.link-prev { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; margin-top: 10px; padding: 8px; border-radius: 16px; background: color-mix(in oklab, var(--c-lowest) 55%, transparent); }
.link-prev .thumb { position: relative; aspect-ratio: 16 / 10; border-radius: 10px; background: linear-gradient(135deg, color-mix(in oklab, var(--f) 45%, #222), #1A1B1E); display: grid; place-items: center; color: #F2F2F0; }
.link-prev .thumb .len { position: absolute; right: 6px; bottom: 6px; font-size: 11px; padding: 1px 5px; border-radius: 6px; background: rgba(0,0,0,.6); }
.link-prev b { display: block; font-size: 14px; line-height: 1.3; }
.link-prev span { font-size: 12px; color: var(--muted); }
.wave { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.wave .play { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.wave svg { flex: 1; height: 28px; min-width: 0; }
.wave svg rect { fill: color-mix(in oklab, var(--on) 55%, transparent); }

.aside { display: grid; gap: 14px; align-content: start; position: sticky; top: 0; }
.panel { padding: 18px; border-radius: var(--r-card); background: var(--c); }
.panel h4 { margin: 0 0 12px; font: 600 14px var(--display); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.panel h4 .sym { font-size: 18px; color: var(--on-var); }
/* окно поверх: палитра команд, переход к заметке, сочетания клавиш */
.modal { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px; }
.modal[hidden] { display: none; }
.modal-card { width: min(640px, 100%); max-height: 72vh; display: flex; flex-direction: column; border-radius: var(--r-card); background: var(--c-high); overflow: hidden; }
.pal-q { width: 100%; height: 56px; border: 0; outline: none; background: transparent; padding: 0 22px; font-size: 17px; flex: none; }
.pal-q::placeholder { color: var(--muted); }
.pal-list, .keys-list { overflow: auto; padding: 0 8px 8px; min-height: 0; }
.pal-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 6px 12px; border-radius: 16px; text-align: left; font-size: 15px; }
.pal-row:hover, .pal-row.sel { background: var(--c-highest); }
.pal-row > .sym { color: var(--on-var); }
.pal-t { min-width: 0; flex: 1; }
.pal-t small { display: block; color: var(--muted); font-size: 12px; }
.pal-k, .keys-k { display: inline-flex; align-items: center; gap: 4px; flex: none; }
kbd { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 7px; background: var(--c-lowest); color: var(--on-var); font: 600 12px var(--body); }
.then, .or { color: var(--muted); font-size: 11px; margin: 0 4px; }
.pal-foot { padding: 10px 20px 14px; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; flex: none; }
.keys-head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 6px 22px; flex: none; }
.keys-head h3 { margin: 0; font: 600 17px var(--display); white-space: nowrap; }
.keys-head .pal-q { flex: 1; width: auto; min-width: 0; height: 40px; border-radius: 100px; background: var(--c-highest); padding: 0 16px; font-size: 14px; }
.keys-g { font-size: 12px; font-weight: 600; color: var(--muted); padding: 14px 12px 4px; }
.keys-row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 4px 6px 4px 12px; border-radius: 14px; }
.keys-row:hover { background: var(--c-highest); }
.keys-row > .sym { color: var(--on-var); font-size: 19px; }
.keys-t { flex: 1; min-width: 0; font-size: 14px; }
.rec { font-size: 13px; color: var(--on); padding: 3px 10px; border-radius: 100px; background: color-mix(in oklab, var(--accent) 18%, transparent); }
.toast button[hidden] { display: none; }

/* ── настройки: вкладка в окне, как файл. Слева разделы, справа их содержимое;
   окно узкое — разделы встают полосой сверху (та же вёрстка, другой размер) ── */
.pane-scroll { container-type: inline-size; }
.set { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 28px; max-width: 1100px; margin: 0 auto; align-items: start; }
.set-nav { position: sticky; top: 0; display: grid; gap: 2px; }
.set-find { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; margin-bottom: 8px; border-radius: 100px; background: var(--c); color: var(--muted); }
.set-find input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 14px; }
.set-nav button { display: flex; align-items: center; gap: 11px; height: 38px; padding: 0 12px; border-radius: 12px; font-size: 14px; color: var(--on-var); text-align: left; white-space: nowrap; }
.set-nav button:hover { background: var(--c); color: var(--on); }
.set-nav button.on { background: var(--c-high); color: var(--on); font-weight: 600; }
.set-nav button .sym { font-size: 19px; }
.set-nav .web { margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 2px 6px; border-radius: 6px; background: var(--c-highest); color: var(--on-var); }
.set-body h1 { font: 700 26px/1.2 var(--display); letter-spacing: -.02em; margin: 2px 0 6px; }
.set-body .lead { color: var(--muted); font-size: 14px; margin: 0 0 20px; max-width: 62ch; }
/* подложка группы — полупрозрачная: видна и в активном окне, и в приглушённом */
.set-group { border-radius: var(--r-tile); background: color-mix(in oklab, var(--on) 5%, transparent); padding: 4px; margin-bottom: 18px; }
.set-gh { font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 14px 4px; }
.set-row { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 12px 8px 14px; border-radius: 16px; }
.set-row + .set-row { margin-top: 2px; }
.set-row:hover { background: color-mix(in oklab, var(--on) 4%, transparent); }
.set-row > .sym { color: var(--on-var); font-size: 21px; flex: none; }
.set-t { flex: 1; min-width: 0; font-size: 15px; }
.set-t small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 1px; }
.set-v { color: var(--on-var); font-size: 14px; display: inline-flex; align-items: center; gap: 4px; flex: none; }
.set-row.link { cursor: pointer; }
.switch { width: 52px; height: 32px; border-radius: 100px; background: var(--c-highest); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: all .18s cubic-bezier(.2, 0, 0, 1); }
.switch.on { background: var(--accent); }
.switch.on::after { left: 24px; top: 4px; width: 24px; height: 24px; background: var(--on-accent); }
.seg2 { display: inline-flex; gap: 3px; padding: 3px; border-radius: 100px; background: var(--c-highest); flex: none; }
.seg2 button { height: 32px; padding: 0 14px; border-radius: 100px; font-size: 13px; color: var(--on-var); }
.seg2 button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.swatches { display: flex; gap: 8px; flex: none; }
.swatches button { width: 28px; height: 28px; border-radius: 50%; background: var(--sw); }
.swatches button.on { outline: 2px solid var(--on); outline-offset: 2px; }
.set-note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: color-mix(in oklab, var(--on) 5%, transparent); color: var(--on-var); font-size: 13px; margin-bottom: 18px; }
.set-note .sym { font-size: 18px; }
/* сочетания: у действия несколько сочетаний-фишек; фишка — заменить, крестик — убрать, плюс — ещё одно */
.chord { display: inline-flex; align-items: center; gap: 3px; padding: 3px 3px 3px 4px; border-radius: 10px; background: var(--c-highest); cursor: pointer; }
.chord:hover { background: color-mix(in oklab, var(--on) 14%, var(--c-highest)); }
.chord .x { font-size: 15px; color: var(--muted); border-radius: 6px; padding: 1px; }
.chord .x:hover { color: var(--on); background: var(--c-high); }
.chord.rec { padding: 4px 10px; font-size: 13px; color: var(--on); background: color-mix(in oklab, var(--accent) 18%, var(--c-highest)); cursor: default; }
.chords { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px; }
.chord-add { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.chord-add:hover { background: var(--c-highest); color: var(--on); }
.set-changed { font-size: 11px; color: var(--muted); }
@container (max-width: 700px) {
  .set { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .set-nav { position: static; display: flex; overflow-x: auto; scrollbar-width: none; gap: 4px; }
  .set-find { display: none; }
  .set-row { flex-wrap: wrap; }
  .chords { justify-content: flex-start; width: 100%; padding-left: 35px; }
}
.cal { padding: 0 8px; }
.cal-head { font-size: 13px; font-weight: 600; margin: 0 0 6px 2px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; font-size: 12px; }
.cal-grid i { font-style: normal; color: var(--muted); font-size: 11px; padding-bottom: 2px; }
.cal-grid button { height: 28px; border-radius: 9px; color: var(--on-var); position: relative; }
.cal-grid button:hover { background: var(--c); color: var(--on); }
.cal-grid button.busy::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--muted); }
.cal-grid button.today { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.later { display: grid; gap: 2px; }
.later button { display: flex; align-items: center; gap: 10px; padding: 8px; margin: 0 -8px; border-radius: 12px; text-align: left; font-size: 14px; }
.later button:hover { background: var(--c-high); }
.later .k { width: 40px; height: 40px; border-radius: 12px; background: color-mix(in oklab, var(--f) var(--tint), var(--c-high)); display: grid; place-items: center; flex: none; }
.later small { display: block; color: var(--muted); font-size: 12px; }
.ago { display: block; width: 100%; text-align: left; padding: 14px; border-radius: var(--r-tile); background: color-mix(in oklab, var(--f) var(--tint), var(--c-high)); }
.ago small { color: var(--on-var); font-size: 12px; }
.ago b { display: block; font-size: 15px; margin-top: 2px; }
.sync-panel { display: flex; gap: 12px; align-items: flex-start; }
.sync-panel .badge { margin-left: auto; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 100px; background: var(--accent); color: var(--on-accent); }
.devices { display: grid; gap: 8px; margin-top: 4px; font-size: 13px; color: var(--on-var); }
.devices div { display: flex; align-items: center; gap: 8px; }
.devices .sym { font-size: 18px; }
.devices em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 12px; }

/* страница заметки: документ со свойствами */
.doc { max-width: 760px; margin: 0 auto; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 18px; }
.crumbs button:hover { color: var(--on); }
.doc-title { font: 700 clamp(26px, 3.4vw, 36px)/1.15 var(--display); letter-spacing: -.02em; margin: 0 0 20px; text-wrap: balance; outline: none; }
.props { display: grid; grid-template-columns: 160px minmax(0, 1fr); row-gap: 2px; margin-bottom: 26px; font-size: 14px; }
.props dt { display: flex; align-items: center; gap: 8px; color: var(--muted); height: 36px; }
.props dt .sym { font-size: 18px; }
.props dd { margin: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-height: 36px; padding: 4px 8px; border-radius: 10px; }
.props dd:hover { background: var(--c); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 100px; background: var(--c-high); font-size: 13px; }
.chip.f { background: color-mix(in oklab, var(--f) var(--tint), var(--c-high)); }
.chip.rem { background: color-mix(in oklab, var(--accent) 10%, var(--c-high)); }
.prop-add { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px; border-radius: 10px; }
.prop-add:hover { background: var(--c); color: var(--on); }
.rule { height: 1px; background: color-mix(in oklab, var(--line) 60%, transparent); margin: 6px 0 24px; }
.prose { font-size: 16px; line-height: 1.65; }
.prose p { margin: 0 0 14px; max-width: 68ch; }
.prose h2 { font: 600 19px/1.3 var(--display); letter-spacing: -.01em; margin: 30px 0 10px; }
.prose .wikilink { color: var(--on); text-decoration: underline; text-decoration-color: color-mix(in oklab, var(--on) 40%, transparent); text-underline-offset: 3px; font-weight: 500; cursor: pointer; }
.prose .money { font-variant-numeric: tabular-nums; background: color-mix(in oklab, #76D5A4 22%, transparent); padding: 1px 6px; border-radius: 6px; }
.todo { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 4px; }
.todo li { display: flex; align-items: center; gap: 10px; padding: 4px 6px; margin-left: -6px; border-radius: 10px; }
.todo li:hover { background: var(--c); }
.todo .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; cursor: pointer; }
.todo li.done .box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.todo li.done .label { color: var(--muted); text-decoration: line-through; }
.todo .box .sym { font-size: 16px; font-variation-settings: "FILL" 1, "wght" 600; }
.price-table { width: 100%; border-collapse: collapse; font-size: 15px; margin: 4px 0 8px; }
.price-table td { padding: 9px 0; border-bottom: 1px solid color-mix(in oklab, var(--line) 50%, transparent); }
.price-table td:last-child { text-align: right; }
.total { display: inline-flex; align-items: center; gap: 8px; margin: 6px 0 18px; padding: 6px 12px 6px 10px; border-radius: 100px; background: color-mix(in oklab, #76D5A4 18%, var(--c)); font-size: 14px; font-weight: 600; }
.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 6px 0 18px; }
.gallery .photo { margin: 0; width: 100%; aspect-ratio: 4 / 3; max-height: none; }
.product { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px; border-radius: var(--r-tile); background: var(--c); margin: 4px 0 18px; }
.product .thumb { aspect-ratio: 1; border-radius: 14px; background: repeating-conic-gradient(color-mix(in oklab, #F7A974 40%, var(--c-high)) 0 25%, var(--c-high) 0 50%) 0 0 / 24px 24px; }
.product b { display: block; font-size: 15px; }
.product small { color: var(--muted); font-size: 13px; }
.product .price { font: 600 16px var(--body); font-variant-numeric: tabular-nums; padding-right: 8px; }

/* правая панель */
.rp-sec { padding: 18px 18px 6px; }
.rp-sec + .rp-sec { border-top: 1px solid color-mix(in oklab, var(--line) 45%, transparent); }
.rp-sec h5 { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; display: flex; justify-content: space-between; }
.rel { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; padding: 9px 10px; margin: 0 -10px 4px; border-radius: 14px; }
.rel:hover { background: var(--c); }
.rel .dot { margin-top: 6px; }
.rel b { display: block; font-size: 14px; font-weight: 600; }
.rel small { display: block; color: var(--muted); font-size: 12px; line-height: 1.4; }
.outline { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 2px; font-size: 14px; }
.outline button { width: 100%; text-align: left; padding: 6px 10px; margin: 0 -10px; border-radius: 10px; color: var(--on-var); }
.outline button:hover { background: var(--c); color: var(--on); }
.mini-graph { width: 100%; height: 170px; border-radius: var(--r-tile); background: var(--c); display: block; margin-bottom: 14px; }
.hist { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--on-var); margin-bottom: 16px; }

/* папка: доска */
.board-tools { display: flex; gap: 6px; margin-left: auto; padding: 4px; border-radius: 100px; background: var(--c); }
.seg { height: 34px; padding: 0 14px; border-radius: 100px; font-size: 13px; color: var(--on-var); display: inline-flex; align-items: center; gap: 6px; }
.seg.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.board { columns: 4 220px; column-gap: 12px; max-width: 1240px; margin: 0 auto; }
.tile { break-inside: avoid; display: block; width: 100%; margin: 0 0 12px; text-align: left; border-radius: var(--r-tile); background: color-mix(in oklab, var(--f) var(--tint), var(--c)); overflow: hidden; transition: transform .16s cubic-bezier(.2, 0, 0, 1); }
.tile:hover { transform: translateY(-2px); }
.tile .photo { margin: 0; width: 100%; max-height: none; border-radius: 0; }
.tile .in { padding: 12px 14px 14px; }
.tile b { display: block; font-size: 15px; line-height: 1.3; }
.tile small { display: flex; gap: 10px; color: var(--on-var); font-size: 12px; margin-top: 6px; }

/* ── строка: ищет и записывает ── */
.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; display: flex; justify-content: center; }
.dock-in { width: min(760px, 100%); pointer-events: auto; }
.results { margin-bottom: 8px; border-radius: var(--r-card); background: var(--c-high); padding: 8px; box-shadow: 0 1px 0 color-mix(in oklab, var(--line) 60%, transparent) inset; max-height: min(52vh, 420px); overflow: auto; }
.results[hidden] { display: none; }
.res { display: flex; gap: 12px; align-items: center; width: 100%; padding: 10px 12px; border-radius: 18px; text-align: left; }
.res:hover, .res.sel { background: var(--c-highest); }
.res.main-act { background: var(--accent); color: var(--on-accent); }
.res.main-act small { color: color-mix(in oklab, var(--on-accent) 65%, transparent); }
.res .k { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none; background: color-mix(in oklab, var(--f) var(--tint), var(--c)); }
.res.main-act .k { background: color-mix(in oklab, var(--on-accent) 12%, transparent); }
.res b { display: block; font-size: 14px; font-weight: 600; }
.res small { display: block; font-size: 12px; color: var(--muted); }
.res mark { background: color-mix(in oklab, #FEC766 45%, transparent); color: inherit; border-radius: 4px; padding: 0 2px; }
.res-label { font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 12px 4px; }
.chips-row { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 8px 6px; }
.line { display: flex; align-items: center; gap: 4px; min-height: 60px; padding: 8px 8px 8px 18px; border-radius: 100px; background: var(--c-high); box-shadow: 0 0 0 1px color-mix(in oklab, var(--line) 55%, transparent); }
.line:focus-within { box-shadow: 0 0 0 2px color-mix(in oklab, var(--on) 35%, transparent); }
.line input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; height: 44px; }
.line input::placeholder { color: var(--muted); }
.line .kbd { font-size: 11px; color: var(--muted); padding: 2px 6px; border-radius: 6px; background: var(--c-highest); margin-right: 6px; }
.send { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; transition: transform .15s; }
.send:active { transform: scale(.92); }

.toast { position: absolute; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); opacity: 0; pointer-events: none; display: flex; gap: 14px; align-items: center; padding: 10px 10px 10px 16px; border-radius: 16px; background: var(--accent); color: var(--on-accent); font-size: 14px; transition: opacity .2s, transform .2s; white-space: nowrap; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { font-weight: 600; padding: 6px 10px; border-radius: 10px; background: color-mix(in oklab, var(--on-accent) 10%, transparent); }
.fresh { animation: drop .45s cubic-bezier(.16, 1, .3, 1); }
@keyframes drop { from { opacity: 0; transform: translateY(-10px) scale(.98); } }

.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }

/* ── узкий экран: доки выезжают поверх, окна встают друг под другом ── */
@media (max-width: 959px) {
  .dockcol { position: fixed; top: var(--gap); bottom: var(--gap); z-index: 40; width: min(320px, 86vw); transition: transform .25s cubic-bezier(.2, 0, 0, 1); }
  .dockcol.left { left: var(--gap); transform: translateX(calc(-100% - 2 * var(--gap))); }
  .dockcol.right { right: var(--gap); transform: translateX(calc(100% + 2 * var(--gap))); }
  .dockcol[hidden] { display: flex; }
  .dockcol.open { transform: none; }
  .body > .gutter { display: none; }
  .bar .presets { display: none; }
}
@media (max-width: 719px) {

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sym = (n, f) => `<span class="sym${f ? " f" : ""}">${n}</span>`;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

/* ── тема ── */
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; }
applyTheme(store.get("stowa-web-theme"));
$("#theme").onclick = () => {

  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next); store.set("stowa-web-theme", next); drawGraph();
};

/* ── раскладка: что в каком доке, какие окна в центре. Запоминается в браузере ── */
let paneSeq = 1;
const pane = (...tabs) => ({ id: "p" + paneSeq++, tabs, at: 0 });
const PRESETS = {
  normal: { t: "Обычная", i: "dashboard", make: () => ({
    left: { open: true, w: 272, list: ["nav", "pinned", "folders", "tags"] },
    right: { open: true, w: 300, list: ["later", "ago", "sync"] },

  focus: { t: "Чтение", i: "chrome_reader_mode", make: () => ({

    right: { open: false, w: 300, list: ["outline", "links"] },
    center: pane("note-kitchen") }) },
  two: { t: "Два окна", i: "vertical_split", make: () => ({
    left: { open: true, w: 260, list: ["folders", "pinned"] },
    right: { open: false, w: 300, list: ["links", "outline"] },
    center: { dir: "row", ratio: 0.55, a: pane("home"), b: pane("note-kitchen") } }) },
  study: { t: "Три окна", i: "space_dashboard", make: () => ({
    left: { open: true, w: 260, list: ["folders", "calendar"] },
    right: { open: true, w: 290, list: ["outline", "links", "graph"] },
    center: { dir: "row", ratio: 0.5, a: pane("note-kitchen"), b: { dir: "col", ratio: 0.5, a: pane("folder-recipes"), b: pane("note-borsch") } } }) },
};
const SAVE_KEY = "stowa-web-layout-v1";
let L = (() => { try { return JSON.parse(store.get(SAVE_KEY)) || null; } catch { return null; } })() || { preset: "normal", ...PRESETS.normal.make() };
L.collapsed ||= [];
// номера окон после перезагрузки не должны повториться
(function bump(n) { if (!n) return; if (n.tabs) paneSeq = Math.max(paneSeq, +n.id.slice(1) + 1); else { bump(n.a); bump(n.b); } })(L.center);
let activeId = (function first(n) { return n.tabs ? n.id : first(n.a); })(L.center);
const saveLayout = () => store.set(SAVE_KEY, JSON.stringify(L));

function panes(n = L.center, out = []) { if (n.tabs) out.push(n); else { panes(n.a, out); panes(n.b, out); } return out; }
const activePane = () => panes().find(p => p.id === activeId) || panes()[0];
const activeRoute = () => { const p = activePane(); return p.tabs[p.at]; };
const activeNote = () => { const r = activeRoute(); return r && r.startsWith("note-") ? r.slice(5) : null; };

/* ── панели доков: любая встаёт в любой док ── */
const open = new Set(["dom"]);
const PANELS = {
  nav: { t: "Разделы", i: "explore", body: () => `<nav>
      ${[["home", "home", "Главная"], ["inbox", "folder-none", "Без папки", 5], ["notifications", "home", "Напоминания", 3], ["schedule", "home", "Посмотреть потом", 4], ["map", "home", "Карта"], ["hub", "home", "Граф"]]
        .map(([i, go, t, n]) => `<button class="nav-item" data-go="${go}" ${activeRoute() === go && t !== "Напоминания" && t !== "Посмотреть потом" && t !== "Карта" && t !== "Граф" ? 'aria-current="page"' : ""}><span class="sym">${i}</span>${t}${n ? `<span class="count num">${n}</span>` : ""}</button>`).join("")}</nav>` },
  pinned: { t: "Закреплено", i: "push_pin", body: () => PINNED.map(id => {
      const n = NOTES.find(x => x.id === id);
      return `<button class="tree-row" data-f="${n.f}" data-go="note-${n.id}" ${activeRoute() === "note-" + n.id ? 'aria-current="page"' : ""}><span class="sym f" style="font-size:16px;color:var(--muted)">push_pin</span>${esc(n.title)}</button>`;
    }).join("") },
  folders: { t: "Папки", i: "folder", body: () => {
      const r = activeRoute();
      const row = (f, lvl, hasKids) => `<button class="tree-row" data-f="${f.id}" style="--lvl:${lvl}" data-go="folder-${f.id}" ${r === "folder-" + f.id ? 'aria-current="page"' : ""}>
        <span class="sym chev ${open.has(f.id) ? "open" : ""}" ${hasKids ? `data-toggle="${f.id}"` : 'style="visibility:hidden"'}>chevron_right</span>
        ${fic(f.id, 18)}${esc(f.name)}<span class="count num">${f.count}</span></button>`;
      return FOLDERS.map(f => row(f, 0, !!f.kids) + (f.kids && open.has(f.id) ? f.kids.map(k => row(k, 1, false)).join("") : "")).join("");
    } },
  tags: { t: "Теги", i: "sell", body: () => `<div class="tags">${["купить", "ремонт", "кухня", "читать", "идея", "важно"].map(t => `<button class="tag">#${t}</button>`).join("")}</div>` },
  smart: { t: "Умные папки", i: "auto_awesome", body: () => [["Чеки за ноябрь", 7], ["Ролики до 10 минут", 12]]
      .map(([t, n]) => `<button class="tree-row"><span class="sym" style="font-size:18px;color:var(--muted)">auto_awesome</span>${t}<span class="count num">${n}</span></button>`).join("") },
  later: { t: "Посмотреть потом", i: "schedule", body: () => `<div class="later" style="padding:0 8px">
      <button data-f="books" data-go="note-lecture"><span class="k">${sym("smart_display")}</span><span>Лекция про память<small>42 мин · сохранено сегодня</small></span></button>
      <button data-f="books"><span class="k">${sym("article")}</span><span>Как устроен поиск по смыслу<small>статья · 11 мин</small></span></button>
      <button data-f="ideas"><span class="k">${sym("smart_display")}</span><span>Обзор русской клавиатуры<small>8 мин</small></span></button></div>` },
  ago: { t: "Год назад", i: "history", body: () => `<div style="padding:0 6px"><button class="ago" data-f="recipes" data-go="note-borsch"><small>15 ноября 2025</small><b>Борщ бабушкин</b></button></div>` },
  sync: { t: "Stowa Sync", i: "cloud_done", body: () => `<div class="devices" style="padding:0 8px">
      <div>${sym("smartphone")}Xiaomi 15T<em>2 мин назад</em></div><div>${sym("phone_iphone")}iPhone 16<em>вчера</em></div><div>${sym("laptop")}Этот браузер<em>сейчас</em></div></div>` },
  links: { t: "Связано", i: "link", body: () => linksHtml(activeNote()) },

function calendarHtml() {
  // ноябрь 2026: 1-е — воскресенье; точки — дни с заметками
  const busy = new Set([3, 6, 9, 12, 14, 15]);
  let cells = Array(6).fill('<span></span>').join("");
  for (let d = 1; d <= 30; d++) cells += `<button class="${d === 15 ? "today" : ""} ${busy.has(d) ? "busy" : ""}">${d}</button>`;
  return `<div class="cal"><div class="cal-head">Ноябрь 2026</div><div class="cal-grid">${["пн", "вт", "ср", "чт", "пт", "сб", "вс"].map(d => `<i>${d}</i>`).join("")}${cells}</div></div>`;
}

function panelHtml(id, side) {
  const p = PANELS[id]; if (!p) return "";
  const folded = L.collapsed.includes(id);
  const other = side === "left" ? "right" : "left";
  return `<section class="pnl ${folded ? "collapsed" : ""}" data-panel="${id}">
    <div class="pnl-head" draggable="true" data-fold="${id}" title="Перетащите, чтобы переставить или унести в другой док">
      <span class="sym chev2">expand_more</span>${sym(p.i)}<span>${p.t}</span>
      <span class="acts">
        <button class="mini" data-move="${id}" title="${other === "right" ? "В правый док" : "В левый док"}">${sym(other === "right" ? "arrow_forward" : "arrow_back")}</button>
        <button class="mini" data-remove="${id}" title="Убрать панель">${sym("close")}</button>
      </span>
    </div>
    <div class="pnl-body">${p.body()}</div></section>`;
}

function renderDocks() {
  for (const side of ["left", "right"]) {
    const d = L[side];
    const col = side === "left" ? $("#side") : $("#right");
    col.style.setProperty("--w", d.w + "px");
    col.hidden = !d.open;
    if (innerWidth < 960) col.classList.toggle("open", !!d.drawer);
    $(`.gutter[data-resize="${side}"]`).hidden = !d.open;
    $("#dock-" + side).innerHTML = d.list.length ? d.list.map(id => panelHtml(id, side)).join("")
      : `<div class="dock-empty">Пустой док. Добавьте панель снизу или перетащите сюда из другого дока.</div>`;
    $("#tog-" + side).classList.toggle("on", d.open);
  }
  requestAnimationFrame(drawGraph);
}

/* ── вкладки окна ── */
function tabTitle(r) {
  if (r === "home") return [sym("home"), "Главная", "none"];
  if (r.startsWith("settings")) return [sym("settings"), "Настройки", "none"];
  if (r.startsWith("note-")) { const n = NOTES.find(x => "note-" + x.id === r); return [fic(n.f, 17), n.title, n.f]; }
  const id = r.slice(7); return [fic(id, 17), FNAME[id], id];
}

/* ── карточка ленты ── */
function cardBody(n) {
  let body = "";
  if (n.kind === "photo") body += `<figure class="photo" style="--ratio:${n.ratio || "4 / 5"}"><figcaption>${sym("image")}${esc(n.file)}</figcaption></figure>`;
  body += `<h3>${esc(n.title)}</h3>`;
  if (n.kind === "check") body += `<ul class="checks">${n.checks.map(([t, d]) => `<li class="${d ? "done" : ""}">${sym(d ? "check_box" : "check_box_outline_blank", d)}${esc(t)}</li>`).join("")}${n.more ? `<li class="more">ещё ${n.more}</li>` : ""}</ul>`;
  else if (n.kind === "voice") body += `<div class="wave"><span class="play">${sym("play_arrow", 1)}</span>${waveSvg()}</div><p style="margin-top:8px">${esc(n.text)}</p>`;
  else if (n.text) body += `<p>${esc(n.text)}</p>`;
  if (n.kind === "link") body += `<div class="link-prev"><div class="thumb">${sym("play_circle", 1)}<span class="len num">42:18</span></div><div><b>Как память выбирает, что сохранить</b><span>${esc(n.site)}</span></div></div>`;
  body += `<div class="meta"><span class="folder">${fic(n.f, 15)}${esc(FNAME[n.f])}</span>${n.rem ? `<span class="rem">${sym("notifications")}${esc(n.rem)}</span>` : ""}<span class="when num">${n.time}</span></div>`;
  return body;
}
function waveSvg() {
  let bars = "", seed = 7;
  for (let i = 0; i < 46; i++) { seed = (seed * 9301 + 49297) % 233280; const h = 6 + (seed / 233280) * 20; bars += `<rect x="${i * 6}" y="${(28 - h) / 2}" width="3" height="${h.toFixed(1)}" rx="1.5"/>`; }
  return `<svg viewBox="0 0 276 28" preserveAspectRatio="none" aria-hidden="true">${bars}</svg>`;
}

function drawGraph() {
  const c = $("#graph"); if (!c) return;
  const r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr; const g = c.getContext("2d"); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement), line = css.getPropertyValue("--line").trim(), on = css.getPropertyValue("--on").trim();
  const cx = r.width / 2, cy = r.height / 2;
  const nodes = [["#F7A974", 0, 0, 9], ["#B5E285", -0.95, -0.55, 6], ["#76D5A4", 0.9, -0.5, 6], ["#5FCDF5", 0.75, 0.7, 6], ["#FEC766", -0.7, 0.72, 5], ["#BCB1FF", -0.15, -0.9, 4], ["#FFA098", 0.15, 0.95, 4]];
  const pos = nodes.map(([c2, x, y, s]) => [c2, cx + x * r.width * 0.36, cy + y * r.height * 0.38, s]);
  g.strokeStyle = line; g.lineWidth = 1.2;
  pos.slice(1).forEach(p => { g.beginPath(); g.moveTo(pos[0][1], pos[0][2]); g.lineTo(p[1], p[2]); g.stroke(); });
  g.beginPath(); g.moveTo(pos[1][1], pos[1][2]); g.lineTo(pos[5][1], pos[5][2]); g.stroke();
  pos.forEach(([col, x, y, s], i) => { g.beginPath(); g.arc(x, y, s, 0, 7); g.fillStyle = col; g.fill(); if (!i) { g.lineWidth = 2; g.strokeStyle = on; g.stroke(); g.strokeStyle = line; g.lineWidth = 1.2; } });
}

/* открыть в активном окне: уже открытое — переключиться на вкладку, иначе новая вкладка */
function go(r) {
  if (!/^(home|note-[a-z]+|folder-[a-z]+|settings(-[a-z]+)?)$/.test(r)) r = "home";
  const p = activePane();

/* разделить окно: новое окно с той же вкладкой встаёт справа или снизу */
function splitPane(id, dir) {
  const replace = (n, parent, key) => {
    if (n.tabs && n.id === id) {
      const fresh = pane(n.tabs[n.at]);
      const s = { dir, ratio: 0.5, a: n, b: fresh };
      if (parent) parent[key] = s; else L.center = s;
      activeId = fresh.id; return true;
    }
    return !n.tabs && (replace(n.a, n, "a") || replace(n.b, n, "b"));
  };
  replace(L.center, null, null); L.preset = null; render();
}
/* закрыть окно: его место занимает сосед */
function closePane(id) {
  const drop = (n, parent, key) => {
    if (n.tabs) return false;
    for (const [mine, other] of [["a", "b"], ["b", "a"]]) {
      if (n[mine].tabs && n[mine].id === id) { if (parent) parent[key] = n[other]; else L.center = n[other]; return true; }
    }
    return drop(n.a, n, "a") || drop(n.b, n, "b");
  };
  drop(L.center, null, null);
  if (!panes().some(p => p.id === activeId)) activeId = panes()[0].id;
  L.preset = null; render();

/* ── плитка слева направо: сколько рядов по 2 точки занимает каждая карточка ── */
const pinsSeen = new WeakSet();
const pinsWatch = new ResizeObserver(entries => entries.forEach(e => sizePins(e.target)));
function sizePins(box) {

/* ── клики ── */
document.addEventListener("pointerdown", e => {
  const el = e.target.closest(".pane");
  if (el && el.dataset.pane !== activeId) { activeId = el.dataset.pane; document.querySelectorAll(".pane").forEach(x => x.classList.toggle("active", x.dataset.pane === activeId)); renderDocks(); }
}, true);
document.addEventListener("click", e => {
  const t = e.target;
  const preset = t.closest("[data-preset]");
  if (preset) { const k = preset.dataset.preset; paneSeq = 1; L = { preset: k, collapsed: [], ...PRESETS[k].make() }; activeId = panes()[0].id; render(); return; }
  const close = t.closest("[data-close]");
  if (close) {
    e.stopPropagation();
    const [id, i] = close.dataset.close.split(":"); const p = panes().find(x => x.id === id);
    if (p.tabs.length === 1) { closePane(id); return; }

  }

  if (tab) { const [id, i] = tab.dataset.tab.split(":"); const p = panes().find(x => x.id === id); p.at = +i; activeId = id; render(); return; }

  const cp = t.closest("[data-closepane]");
  if (cp) { closePane(cp.dataset.closepane); return; }
  const fold = t.closest("[data-fold]");
  if (fold && !t.closest(".acts")) { const id = fold.dataset.fold; L.collapsed = L.collapsed.includes(id) ? L.collapsed.filter(x => x !== id) : [...L.collapsed, id]; renderDocks(); saveLayout(); return; }
  const mv = t.closest("[data-move]");
  if (mv) { const id = mv.dataset.move; const from = L.left.list.includes(id) ? "left" : "right", to = from === "left" ? "right" : "left";
    L[from].list = L[from].list.filter(x => x !== id); L[to].list.push(id); L[to].open = true; L.preset = null; render(); return; }
  const rm = t.closest("[data-remove]");
  if (rm) { const id = rm.dataset.remove; for (const s of ["left", "right"]) L[s].list = L[s].list.filter(x => x !== id); L.preset = null; render(); return; }
  const am = t.closest("[data-addmenu]");
  if (am) { e.stopPropagation(); toggleAddMenu(am.dataset.addmenu); return; }
  const pick = t.closest("[data-pick]");
  if (pick) { const [side, id] = pick.dataset.pick.split(":"); for (const s of ["left", "right"]) L[s].list = L[s].list.filter(x => x !== id);
    L[side].list.push(id); L.collapsed = L.collapsed.filter(x => x !== id); L.preset = null; closeAddMenus(); render(); return; }
  if (!t.closest(".add-menu")) closeAddMenus();
  const tog = t.closest("[data-toggle]");
  if (tog) { e.stopPropagation(); const id = tog.dataset.toggle; open.has(id) ? open.delete(id) : open.add(id); renderDocks(); return; }
  const jump = t.closest("[data-jump]");

  const box = t.closest(".todo .box");

  const link = t.closest("[data-go]");

/* меню «Панель»: какие панели можно поставить в этот док */

/* ── перетаскивание панелей: внутри дока и между доками ── */
let dragId = null;
document.addEventListener("dragstart", e => {

document.addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".dragging").forEach(x => x.classList.remove("dragging")); document.querySelectorAll(".drop-mark").forEach(x => x.remove()); });
function dropIndex(dock, y) {

document.addEventListener("pointerdown", e => {

  e.preventDefault(); g.setPointerCapture(e.pointerId); g.classList.add("drag");

    } else {
      const ratio = rows ? (ev.clientY - box.top) / box.height : (ev.clientX - box.left) / box.width;

/* свои сочетания поверх стандартных: { id команды: [сочетания] } */
const KEYS_SAVE = "stowa-web-keys-v1";
let customKeys = (() => { try { return JSON.parse(store.get(KEYS_SAVE)) || {}; } catch { return {}; } })();
const keysOf = c => customKeys[c.id] || c.keys;

/* сочетание из нажатия: по месту клавиши, а не по букве — русская раскладка не мешает */
const CODE_NAMES = { BracketLeft: "[", BracketRight: "]", Backslash: "\\", Slash: "/", Comma: ",", Period: ".", Backspace: "Backspace", Delete: "Delete", ArrowRight: "→", ArrowLeft: "←", ArrowUp: "↑", ArrowDown: "↓", Enter: "Enter", Escape: "Esc", Space: "Space", Minus: "-", Equal: "=" };
function comboOf(e) {
  let k = CODE_NAMES[e.code] || (e.code.startsWith("Key") ? e.code.slice(3) : e.code.startsWith("Digit") ? e.code.slice(5) : null);
  if (!k) return null;
  if (e.shiftKey && k === "/") k = "?";
  return [(e.ctrlKey || e.metaKey) && "Ctrl", e.altKey && "Alt", e.shiftKey && k !== "?" && "Shift", k].filter(Boolean).join("+");
}
const show = combo => combo.split(" ").map(part => part.split("+").map(k => `<kbd>${isMac ? { Ctrl: "⌘", Alt: "⌥", Shift: "⇧" }[k] || k : k}</kbd>`).join("")).join('<span class="then">затем</span>');
const typing = el => el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));

let pending = null, pendingTimer;
document.addEventListener("keydown", e => {
  if (recording) return;
  if (e.key === "Escape") {
    if (!$("#modal").hidden) { closeModal(); return; }
    if (document.activeElement === q) { q.value = ""; results.hidden = true; q.blur(); }
    closeDrawers(); closeAddMenus(); return;
  }
  if (!$("#modal").hidden) return;
  const combo = comboOf(e); if (!combo) return;
  const bare = !combo.includes("Ctrl") && !combo.includes("Alt");
  // одна клавиша без модификаторов — только вне поля ввода
  if (bare && typing(document.activeElement)) return;
  const seq = pending ? pending + " " + combo : combo;
  const hit = COMMANDS.find(c => keysOf(c).includes(seq));
  if (hit) { e.preventDefault(); pending = null; hit.run(); return; }
  // начало двухклавишного сочетания (G затем H)
  if (!pending && COMMANDS.some(c => keysOf(c).some(k => k.startsWith(combo + " ")))) {
    e.preventDefault(); pending = combo; clearTimeout(pendingTimer); pendingTimer = setTimeout(() => pending = null, 1200); return;
  }
  pending = null;
});

/* ── окно поверх: палитра команд, переход к заметке, папки, сочетания ── */

    : Object.keys(FNAME).map(id => ({ f: id, t: FNAME[id], sub: "переложить сюда", run: () => { const n = note(activeNote()); const was = n.f; n.f = id; render(); toast(`Переложено в «${FNAME[id]}»`, () => { n.f = was; render(); }); } }));
  const ph = { commands: "Команда…", notes: "Название заметки или папки…", folders: "В какую папку…" }[kind];
  $("#modal").hidden = false;
  $("#modal-card").innerHTML = `<input class="pal-q" id="pal-q" placeholder="${ph}" autocomplete="off"><div class="pal-list" id="pal-list"></div>
    <div class="pal-foot">${show("↑")}${show("↓")} выбрать · ${show("Enter")} открыть · ${show("Esc")} закрыть</div>`;
  let sel = 0, shown = items;
  const draw = () => {
    const words = $("#pal-q").value.toLowerCase().split(/\s+/).filter(Boolean);
    shown = items.filter(it => words.every(w => (it.t + " " + it.sub).toLowerCase().includes(w))).slice(0, 40);
    sel = Math.min(sel, Math.max(0, shown.length - 1));
    $("#pal-list").innerHTML = shown.length ? shown.map((it, k) => `<button class="pal-row ${k === sel ? "sel" : ""}" data-k="${k}" ${it.f ? `data-f="${it.f}"` : ""}>
        ${it.f ? fic(it.f, 20) : sym(it.i)}<span class="pal-t">${esc(it.t)}<small>${esc(it.sub)}</small></span>${it.keys ? `<span class="pal-k">${show(it.keys)}</span>` : ""}</button>`).join("")
      : `<div class="pnl-note" style="padding:14px">Ничего не нашлось</div>`;
    $("#pal-list .sel")?.scrollIntoView({ block: "nearest" });
  };
  const pick = k => { const it = shown[k]; if (!it) return; closeModal(); it.run(); };
  $("#pal-q").oninput = () => { sel = 0; draw(); };
  $("#pal-q").onkeydown = e => {
    if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(sel + 1, shown.length - 1); draw(); }
    if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(sel - 1, 0); draw(); }
    if (e.key === "Enter") { e.preventDefault(); pick(sel); }
  };
  $("#pal-list").onclick = e => { const row = e.target.closest("[data-k]"); if (row) pick(+row.dataset.k); };
  draw(); $("#pal-q").focus();
}

$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

const val = t => `<span class="set-v">${t}${sym("chevron_right")}</span>`;
const row = (icon, title, hint, ctl = "", link = "") => `<div class="set-row ${link ? "link" : ""}" ${link ? `data-act="${link}"` : ""}>${sym(icon)}<span class="set-t">${title}${hint ? `<small>${hint}</small>` : ""}</span>${ctl}</div>`;

/* сочетания: у действия одно или несколько. Фишка — заменить её, крестик — убрать,
   плюс — добавить ещё одно, стрелка — вернуть как было */
let recording = null; // { id, i }: i — какую фишку заменить, -1 — добавить новую
function keysSection() {
  const groups = [...new Set(COMMANDS.map(c => c.g))];
  const changed = Object.keys(customKeys).length;
  return `<div class="set-note">${sym("info")}<span>Одна клавиша без Ctrl и Alt срабатывает, когда курсор не в поле ввода. Клавиши ловятся по месту на клавиатуре — в любой раскладке.
      Ctrl+N, Ctrl+T, Ctrl+W, Ctrl+Tab браузер оставляет себе.</span></div>
    ${changed ? `<div style="margin:-6px 0 14px"><button class="seg" data-resetall style="background:var(--c);">${sym("restart_alt")}Вернуть все как было · изменено ${changed}</button></div>` : ""}
    ${groups.map(g => group(g, COMMANDS.filter(c => c.g === g).map(c => {
      const keys = keysOf(c);
      const chips = keys.map((k, i) => recording && recording.id === c.id && recording.i === i
        ? `<span class="chord rec">Нажмите сочетание · Esc — отмена</span>`
        : `<span class="chord" data-chord="${c.id}:${i}" title="Нажмите, чтобы заменить">${show(k)}<span class="sym x" data-unchord="${c.id}:${i}" title="Убрать">close</span></span>`).join("");
      const adding = recording && recording.id === c.id && recording.i === -1 ? `<span class="chord rec">Нажмите сочетание · Esc — отмена</span>` : "";
      return row(c.i, c.t, customKeys[c.id] ? '<span class="set-changed">изменено</span>' : "",
        `<div class="chords">${chips}${adding}<button class="chord-add" data-addchord="${c.id}" title="Добавить сочетание">${sym("add")}</button>
          ${customKeys[c.id] ? `<button class="chord-add" data-resetkeys="${c.id}" title="Вернуть как было">${sym("restart_alt")}</button>` : ""}</div>`);
    }))).join("")}`;
}

function viewSettings(sec) {
  sec = SECTIONS.some(s => s[0] === sec) ? sec : "vault";
  const [, title] = SECTIONS.find(s => s[0] === sec);
  return `<div class="set">
    <nav class="set-nav" aria-label="Разделы настроек">
      <label class="set-find">${sym("search")}<input data-setfind placeholder="Найти настройку" autocomplete="off"></label>
      ${SECTIONS.map(([id, t, i, web]) => `<button class="${id === sec ? "on" : ""}" data-setsec="${id}">${sym(i)}${t}${web ? '<span class="web">ВЕБ</span>' : ""}</button>`).join("")}
    </nav>
    <div class="set-body">
      ${SECTIONS.map(([id, t]) => `<section data-sec="${id}" ${id === sec ? "" : "hidden"}><h1>${t}</h1>${settingsSection(id)}</section>`).join("")}
      <div class="pnl-note" data-setnone hidden>Такой настройки нет.</div>
    </div></div>`;
}

/* поиск по настройкам: видны все разделы, только совпавшие строки */
document.addEventListener("input", e => {
  const f = e.target.closest("[data-setfind]"); if (!f) return;
  const box = f.closest(".set"); const w = f.value.trim().toLowerCase();
  const cur = box.querySelector(".set-nav .on")?.dataset.setsec;
  let any = false;
  box.querySelectorAll("section[data-sec]").forEach(s => {
    let hit = 0;
    s.querySelectorAll(".set-row").forEach(r => { const ok = !w || r.textContent.toLowerCase().includes(w); r.hidden = !ok; hit += ok; });
    s.querySelectorAll(".set-group").forEach(g => g.hidden = w && !g.querySelector(".set-row:not([hidden])"));
    s.hidden = w ? !hit : s.dataset.sec !== cur; any ||= !!hit;
  });
  box.querySelector("[data-setnone]").hidden = !w || any;
});

document.addEventListener("click", e => {
  const t = e.target;
  const sec = t.closest("[data-setsec]");
  if (sec) { const p = activePane(); p.tabs[p.at] = "settings-" + sec.dataset.setsec; render(); return; }
  const sw = t.closest("[data-set]");
  if (sw) { SET[sw.dataset.set] = !SET[sw.dataset.set]; saveSet(); render(); return; }
  const sg = t.closest("[data-seg]");
  if (sg) { const [k, v] = sg.dataset.seg.split(":"); SET[k] = v; saveSet(); if (k === "theme") { applyTheme(v === "system" ? null : v); if (v === "system") delete document.documentElement.dataset.theme; } render(); return; }
  const act = t.closest("[data-act]");
  if (act && !t.closest("[data-set],[data-seg]")) { const [kind, arg] = act.dataset.act.split(":"); if (kind === "toast") toast(arg); if (kind === "lang") { SET.lang = arg; saveSet(); render(); } return; }
  const un = t.closest("[data-unchord]");
  if (un) { e.stopPropagation(); const [id, i] = un.dataset.unchord.split(":"); const c = COMMANDS.find(x => x.id === id); customKeys[id] = keysOf(c).filter((_, k) => k !== +i); saveKeys(); return; }
  const ch = t.closest("[data-chord]");
  if (ch) { const [id, i] = ch.dataset.chord.split(":"); recording = { id, i: +i }; render(); return; }
  const add = t.closest("[data-addchord]");
  if (add) { recording = { id: add.dataset.addchord, i: -1 }; render(); return; }
  const rk = t.closest("[data-resetkeys]");
  if (rk) { delete customKeys[rk.dataset.resetkeys]; saveKeys(); return; }
  if (t.closest("[data-resetall]")) { customKeys = {}; saveKeys(); toast("Все сочетания как были"); }
});
function saveKeys() { store.set(KEYS_SAVE, JSON.stringify(customKeys)); render(); }

/* запись сочетания: следующее нажатие заменяет фишку или добавляется новой */
document.addEventListener("keydown", e => {
  if (!recording) return;
  if (["Control", "Alt", "Shift", "Meta"].includes(e.key)) return;
  e.preventDefault(); e.stopPropagation();
  if (e.key === "Escape") { recording = null; render(); return; }
  const combo = comboOf(e); if (!combo) return;
  const reserved = ["Ctrl+N", "Ctrl+T", "Ctrl+W", "Ctrl+Shift+N", "Ctrl+Shift+T", "Ctrl+Shift+W", "Ctrl+Tab", "Ctrl+Shift+Tab", ...[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => "Ctrl+" + n)];
  if (reserved.includes(combo)) { toast(`${combo} браузер оставляет себе — выберите другое`); return; }
  const c = COMMANDS.find(x => x.id === recording.id);
  // занятое другой командой — у той снимается, и об этом говорим
  const owner = COMMANDS.find(x => x.id !== c.id && keysOf(x).includes(combo));
  if (owner) customKeys[owner.id] = keysOf(owner).filter(x => x !== combo);
  const keys = keysOf(c).filter(x => x !== combo);
  if (recording.i < 0 || recording.i >= keys.length) keys.push(combo); else keys.splice(recording.i, 1, combo);
  customKeys[c.id] = keys;
  recording = null; saveKeys();
  if (owner) toast(`${combo} теперь у «${c.t}», у «${owner.t}» снято`);
}, true);

render();
</script>
